<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='pmg_v1',uid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,'0');
let S={reqs:[],name:'',seen:{},last:0};try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
/* Nama petugas = nama pengguna login; departemen dari email akun (nama@pm-departemen.local) */
const ME=(window.PMG_AKSES&&PMG_AKSES.user&&PMG_AKSES.user())||'',DEPT=(window.PMG_AKSES&&PMG_AKSES.dept&&PMG_AKSES.dept())||'',CO='PT INDOPOLY SWAKARSA INDUSTRY TBK';
if(ME){S.name=ME;save()}
const who=()=>ME||S.name||'Pengguna',avaSrc=()=>{try{return PMG_AKSES.foto(who())}catch(e){return''}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fd=s=>{if(!/^\d{4}-\d\d-\d\d$/.test(s||''))return s||'-';const[y,m,d]=s.split('-'),M=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];return d+' '+M[m-1]+' '+y};
let V={tab:'open',id:null,err:'',q:'',f:'all',per:'bln',from:today().slice(0,8)+'01',to:today()};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const got=l=>l.got===''||l.got==null?null:num(l.got);
function ist(l){const g=got(l);if(g===null)return['Belum','mu'];if(g===0)return['Belum','mu'];if(g<l.qty)return['Kurang '+Math.round((l.qty-g)*100)/100,'am'];if(g>l.qty)return['Lebih '+Math.round((g-l.qty)*100)/100,'bl'];return['Sesuai','gr']}
const prog=r=>{const n=r.items.length||1;return Math.round(r.items.filter(l=>got(l)!==null&&got(l)>=l.qty).length/n*100)};
const cnt=r=>r.items.filter(l=>got(l)!==null).length;
const rd2=v=>Math.round(v*100)/100,short=l=>{const g=got(l);return rd2(Math.max(0,l.qty-(g===null?0:g)))};
const shorts=r=>r.items.filter(l=>short(l)>0),hasShort=r=>r.status==='done'&&shorts(r).length>0;
const req=l=>got(l)!==null&&short(l)>0&&!String(l.note||'').trim();
const shMsg=l=>`Kurang <b>${short(l)}</b> ${esc(l.unit)} dari ${l.qty}. Isi keterangan kenapa kurang.`;
function upd(l){const[a,c]=ist(l),b=$('#b_'+l.id);if(b){b.textContent=a;b.className='pill '+c}const w=$('#sh_'+l.id);if(w){const s=got(l)!==null&&short(l)>0;w.hidden=!s;if(s)w.innerHTML=shMsg(l)}const n=$('#n_'+l.id);if(n)n.classList.toggle('req',req(l))}

function tst(m){const t=$('#tt');t.innerHTML='<span>'+esc(m)+'</span>';clearTimeout(tst.h);tst.h=setTimeout(()=>t.innerHTML='',3000)}
function card(r){const d=r.status==='done',p=prog(r);return `<div class="card" data-a=v data-id=${r.id} style="cursor:pointer"><div class=t><div><b>${esc(r.no)}</b><small>${fd(r.date)} • ${esc(r.by||'-')}</small>${r.spk.length?`<small>SPK ${esc(r.spk.join(', '))}${r.cust?' • '+esc(r.cust):''}</small>`:''}</div><span class=stk><span class="pill ${d?'gr':cnt(r)?'am':'mu'}">${d?'Selesai':cnt(r)?'Sebagian':'Menunggu'}</span>${hasShort(r)?'<span class="pill rd">Ada kekurangan</span>':''}</span></div><div class=bar><i style="width:${p}%"></i></div><small class=mut style="margin-top:6px">${cnt(r)}/${r.items.length} item dicek • ${p}% sesuai${d?' • diterima '+fd(r.rdate)+' oleh '+esc(r.recv):''}${hasShort(r)?' • kurang '+shorts(r).length+' item':''}${r.ship?' • 🚚 dikirim':''}</small></div>`}

/* Terima otomatis dari app permintaan lewat Firebase Realtime Database (alamat di ../config.js) */

async function pull(manual){if(!DB){if(manual)tst('Alamat database belum diisi (config.js)');return}

try{const res=await fetch(DB+'/inbox/'+KODE+'.json',{cache:'no-store'});if(!res.ok){PERR=(res.status===401||res.status===403)?'Ditolak server ('+res.status+'), login ulang':'Error server ('+res.status+')';throw new Error(res.status)}PERR='';
