<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>PM Gudang – Penerimaan Packaging</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2548D0">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PM Gudang">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<script src="../config.js"></script>
<script src="../pin.js"></script><script src="../akses.js" data-role="gudang"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--pri:#2548D0;--pd:#1E3A8A;--pb:#EFF6FF;--bg:#F8FAFC;--card:#fff;--bd:#E2E8F0;--tx:#0F172A;--tx2:#64748B;--mut:#94A3B8;--sub:#F1F5F9;--gr:#059669;--grb:#ECFDF5;--am:#D97706;--amb:#FFFBEB;--red:#DC2626;--redb:#FEF2F2;--bl:#2548D0;--blb:#EFF6FF;--sh:0 2px 8px -2px rgba(15,23,42,.05),0 1px 3px -1px rgba(15,23,42,.04);--sh2:0 8px 24px -4px rgba(37,72,208,.22),0 4px 8px -2px rgba(15,23,42,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/20px 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-transform:uppercase;letter-spacing:.2px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-transform:uppercase;letter-spacing:inherit}
#app{max-width:480px;margin:0 auto;padding:0 16px 100px}
header{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header .lg{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--pd),var(--pri));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;box-shadow:0 4px 10px -2px rgba(37,72,208,.35)}
header div{flex:1;min-width:0}header small{color:var(--tx2);font-size:11px;display:block;font-weight:600}header h1{margin:0;font-size:20px;line-height:26px;font-weight:700}
.xo{flex:none;height:34px;padding:0 12px;border-radius:99px;background:var(--redb);color:var(--red);font-weight:700;font-size:12px}
.back{width:38px;height:38px;border-radius:50%;background:var(--pb);color:var(--pri);font-weight:700;font-size:18px}
.hero{background:linear-gradient(135deg,#1E3A8A,#2548D0 60%,#4766E5);color:#fff;border-radius:16px;padding:16px;box-shadow:var(--sh2);margin-bottom:14px}
.hero small{color:#C2CBFF;font-size:11px;font-weight:600;display:block}.hero h2{margin:0;font-size:20px;line-height:28px;font-weight:700}.hero p{margin:2px 0 0;color:#C2CBFF}
.hero .seg{display:inline-flex;background:rgba(255,255,255,.15);border-radius:99px;padding:3px;margin:12px 0 0}.hero .seg button{padding:6px 14px;border-radius:99px;font-weight:600;font-size:13px;color:#fff;flex:none}.hero .seg .on{background:#fff;color:var(--pri);box-shadow:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.g3 .card{text-align:center;padding:12px 6px;margin:0}.g3 b{display:block;font-size:24px;line-height:30px;color:var(--pri)}.g3 small{color:var(--tx2);font-size:11px;font-weight:600}
.btn{height:50px;border-radius:12px;background:var(--pri);color:#fff;font-weight:600;font-size:15px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:var(--sh2)}
.btn:active{transform:scale(.98);background:var(--pd)}.btn.s{background:var(--pb);color:var(--pri);box-shadow:none;height:48px}.btn.d{background:var(--redb);color:var(--red);box-shadow:none;height:44px;border-radius:10px}.btn.w{background:#25D366;box-shadow:0 8px 20px -6px rgba(37,211,102,.5);margin-bottom:10px}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.row .btn{padding:0 8px;font-size:13px;white-space:nowrap}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;border:1px solid;white-space:nowrap}
.pill.gr{background:var(--grb);color:var(--gr);border-color:#A7F3D0}.pill.am{background:var(--amb);color:var(--am);border-color:#FDE68A}.pill.rd{background:var(--redb);color:var(--red);border-color:#FECACA}.pill.bl{background:var(--blb);color:var(--bl);border-color:#BFDBFE}.pill.mu{background:var(--sub);color:var(--tx2);border-color:var(--bd)}
.t{display:flex;gap:10px;align-items:flex-start}.t>div{flex:1;min-width:0}.t b{font-size:15px}.t small,.mut{color:var(--tx2);display:block}
.bar{height:8px;border-radius:99px;background:var(--sub);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#4766E5);border-radius:99px}
textarea,input,select{width:100%;border:1.5px solid #CBD5E1;border-radius:10px;padding:0 14px;height:48px;font:inherit;background:var(--card);color:var(--tx)}
textarea{height:170px;padding:10px 14px;resize:vertical}
textarea:focus,input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,72,208,.15)}
label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:12px}label>*{margin-top:4px}
.it{padding:14px 0;border-top:1px solid var(--bd)}.it:first-of-type{border-top:0;padding-top:0}.it:last-of-type{padding-bottom:0}
.qr{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.qr input{text-align:center;font-weight:700;font-size:16px}.qr button{height:48px;padding:0 16px;border-radius:10px;background:var(--pb);color:var(--pri);font-weight:700}
.seg{display:flex;background:var(--sub);border-radius:99px;padding:3px;margin-bottom:12px}.seg button{flex:1;padding:8px;border-radius:99px;font-weight:600;font-size:13px;color:var(--tx2)}.seg .on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(15,23,42,.1)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:7}
nav div{max-width:480px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}nav button{height:64px;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}nav button span{font-size:20px;line-height:22px}nav .on{color:var(--pri)}
.em{text-align:center;color:var(--tx2);padding:28px 12px}.em b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
#tt{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;pointer-events:none}#tt span{background:#2F3038;color:#F1EFFB;padding:12px 16px;border-radius:12px;box-shadow:var(--sh2)}
.hp{font-size:12px;color:var(--tx2);margin:0 0 10px}
input.req{border-color:var(--red);background:var(--redb)}
.sw{background:var(--redb);color:var(--red);border:1px solid #FECACA;border-radius:10px;padding:8px 12px;margin-top:10px;font-size:12px;font-weight:600}.sw[hidden]{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;white-space:nowrap;flex:none}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.srch{margin:0 0 10px}.srch input{height:46px;background:var(--card);letter-spacing:.2px}
.hero .hr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.hero .hr .seg{margin:0}.hero .rf{background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:6px 12px;font-weight:600;font-size:12px;flex:none}
.hero .sy{font-size:12px;margin-top:6px;color:#DBEAFE}
.ks{border-top:1px solid var(--bd);padding:10px 0}.ks:first-of-type{border-top:0}.ks b{font-size:13px}
.stk{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
::placeholder{color:var(--mut);opacity:1}
@media(min-width:768px){
body{font-size:15px;line-height:22px}
#app{max-width:none;padding:0 28px 120px}
header{padding:18px 0}header h1{font-size:24px;line-height:30px}
.hero{padding:24px 28px}.hero h2{font-size:26px;line-height:34px}
.g3 b{font-size:30px;line-height:36px}.card{padding:20px}
nav div{max-width:560px}
}
@media(min-width:1100px){
body{padding-left:248px}
nav{top:0;bottom:0;right:auto;width:248px;border-top:0;border-right:1px solid var(--bd);padding:88px 14px 16px;overflow:auto}
nav::before{content:"PM Gudang";position:absolute;top:26px;left:26px;font-weight:700;font-size:18px;color:var(--pri);letter-spacing:-.01em}
nav div{display:flex;flex-direction:column;gap:4px;max-width:none}
nav button{height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;border-radius:10px;font-size:14px}
nav button span{width:24px;text-align:center}
nav .on{background:var(--pb)}
@media(hover:hover){nav button:hover{color:var(--pri)}}
#app{max-width:none;margin:0;padding:0 40px 100px}
header .lg{display:none}
#lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;align-items:start}#lst .card{margin:0}#lst .em{grid-column:1/-1}
#tt{left:268px;right:16px;bottom:30px}
}

/* ===== Navbar strip-3 (laptop/desktop) & tekstur background ===== */
body{background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,rgba(37,72,208,.11) 1.1px,transparent 1.6px),linear-gradient(180deg,#EEF3FF 0,rgba(248,250,252,0) 340px);background-size:22px 22px,100% 100%;background-attachment:fixed}
header{background:rgba(248,250,252,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mb{display:none}
@media(min-width:1100px){
.mb{display:grid;place-items:center;position:fixed;top:16px;left:16px;width:42px;height:42px;border-radius:12px;background:var(--card);color:var(--pri);border:1px solid var(--bd);box-shadow:var(--sh);z-index:8;cursor:pointer}
.mb:hover{background:var(--pb)}
html.nvo .mb{background:var(--pri);color:#fff;border-color:var(--pri)}
body{padding-left:0!important}
header{padding-left:58px!important}
nav{transform:translateX(-102%);transition:transform .22s ease,box-shadow .22s ease;visibility:hidden;z-index:7}
html.nvo nav{transform:none;visibility:visible;box-shadow:12px 0 32px -8px rgba(15,23,42,.28)}
nav::before{left:72px!important;top:30px!important}
.toast,#tt{left:16px!important}
}
@media(prefers-color-scheme:dark){body{background-color:#F8FAFC}}

/* ===== Responsif v2: HP kecil / HP / tablet / laptop / layar lebar ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:clip;min-height:100vh;min-height:100dvh}
img,svg,video{max-width:100%}
.row>*{min-width:0}
.lh .g,.t>div,.rq .t>div,.gl .g{min-width:0;overflow-wrap:anywhere}
.lh .g b,.rq b.n,.t b,.gl .g b,.ch,.pill{overflow-wrap:anywhere}
@media(max-width:360px){
#app{padding-left:12px;padding-right:12px}
.hero{padding:14px 12px}.card{padding:12px}.g3{gap:6px}.g3 b{font-size:18px;line-height:24px}
.chip{padding:5px 11px}.btn{padding:0 10px}.row{gap:6px}
header h1{font-size:15px;line-height:20px}.row .btn{font-size:11.5px;padding:0 6px}
}
@media(hover:none) and (pointer:coarse) and (max-width:767px){input,select,textarea,.f input,.f select,.f textarea,.in{font-size:16px}}
@media(max-height:480px) and (orientation:landscape){nav button{height:46px}#app{padding-bottom:70px}.sheet{max-height:94%}}
@media(min-width:768px) and (max-width:1099px){#app{max-width:920px;margin-left:auto;margin-right:auto}nav div{max-width:640px}}
@media(min-width:1100px){#app{max-width:1280px;margin-left:auto;margin-right:auto}}
@media(min-width:1700px){#app{max-width:1440px}#lst,#hl{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}}
.paper:not(#pk){overflow-wrap:anywhere}.paper:not(#pk) table{table-layout:auto}
@media(min-width:768px) and (max-width:1099px){#lst{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}#lst .card{margin:0}#lst .em{grid-column:1/-1}}
@media(min-width:768px){.srch input{max-width:520px}}
@media(min-width:1100px){header{padding-left:0!important}}
</style></head><body><button class="mb" id="mb" type="button" aria-label="Menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<div id="app"></div><div id="tt"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='pmg_v1',uid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,'0');
let S={reqs:[],name:'',seen:{},last:0};try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fd=s=>{if(!/^\d{4}-\d\d-\d\d$/.test(s||''))return s||'-';const[y,m,d]=s.split('-'),M=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];return d+' '+M[m-1]+' '+y};
let V={tab:'open',id:null,err:'',q:'',f:'all',per:'bln'};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const got=l=>l.got===''||l.got==null?null:num(l.got);
function ist(l){const g=got(l);if(g===null)return['Belum','mu'];if(g===0)return['Belum','mu'];if(g<l.qty)return['Kurang '+Math.round((l.qty-g)*100)/100,'am'];if(g>l.qty)return['Lebih '+Math.round((g-l.qty)*100)/100,'bl'];return['Sesuai','gr']}
const prog=r=>{const n=r.items.length||1;return Math.round(r.items.filter(l=>got(l)!==null&&got(l)>=l.qty).length/n*100)};
const cnt=r=>r.items.filter(l=>got(l)!==null).length;
const rd2=v=>Math.round(v*100)/100,short=l=>{const g=got(l);return rd2(Math.max(0,l.qty-(g===null?0:g)))};
const shorts=r=>r.items.filter(l=>short(l)>0),hasShort=r=>r.status==='done'&&shorts(r).length>0;
const req=l=>got(l)!==null&&short(l)>0&&!String(l.note||'').trim();
const shMsg=l=>`Kurang <b>${short(l)}</b> ${esc(l.unit)} dari ${l.qty}. Isi keterangan kenapa kurang.`;
function upd(l){const[a,c]=ist(l),b=$('#b_'+l.id);if(b){b.textContent=a;b.className='pill '+c}const w=$('#sh_'+l.id);if(w){const s=got(l)!==null&&short(l)>0;w.hidden=!s;if(s)w.innerHTML=shMsg(l)}const n=$('#n_'+l.id);if(n)n.classList.toggle('req',req(l))}

function tst(m){const t=$('#tt');t.innerHTML='<span>'+esc(m)+'</span>';clearTimeout(tst.h);tst.h=setTimeout(()=>t.innerHTML='',3000)}
function card(r){const d=r.status==='done',p=prog(r);return `<div class="card" data-a=v data-id=${r.id} style="cursor:pointer"><div class=t><div><b>${esc(r.no)}</b><small>${fd(r.date)} • ${esc(r.by||'-')}</small>${r.spk.length?`<small>SPK ${esc(r.spk.join(', '))}${r.cust?' • '+esc(r.cust):''}</small>`:''}</div><span class=stk><span class="pill ${d?'gr':cnt(r)?'am':'mu'}">${d?'Selesai':cnt(r)?'Sebagian':'Menunggu'}</span>${hasShort(r)?'<span class="pill rd">Ada kekurangan</span>':''}</span></div><div class=bar><i style="width:${p}%"></i></div><small class=mut style="margin-top:6px">${cnt(r)}/${r.items.length} item dicek • ${p}% sesuai${d?' • diterima '+fd(r.rdate)+' oleh '+esc(r.recv):''}${hasShort(r)?' • kurang '+shorts(r).length+' item':''}${r.ship?' • 🚚 dikirim':''}</small></div>`}
const flt=r=>{const q=(V.q||'').trim().toLowerCase();if(q&&![r.no,r.by,r.cust,(r.spk||[]).join(' '),r.items.map(l=>l.nm).join(' ')].join(' ').toLowerCase().includes(q))return false;
if(V.tab==='open'){if(V.f==='wait')return !cnt(r);if(V.f==='part')return cnt(r)>0}else if(V.f==='short')return hasShort(r);return true};
function listHtml(){const L=S.reqs.filter(r=>(V.tab==='open')===(r.status!=='done')).filter(flt),f=V.q||V.f!=='all';
return L.map(card).join('')||`<div class="card em"><b>${f?'Tidak ada yang cocok':V.tab==='open'?'Belum ada permintaan masuk':'Belum ada penerimaan selesai'}</b>${f?'Ubah kata kunci atau filter.':V.tab==='open'?(DB?'Permintaan dari bagian permintaan masuk sendiri saat tombol “Kirim ke Gudang” ditekan.':'Alamat database belum diisi (config.js), jadi permintaan belum bisa masuk otomatis.'):''}</div>`}
function vList(){const op=S.reqs.filter(r=>r.status!=='done'),dn=S.reqs.filter(r=>r.status==='done'),o=V.tab==='open',
fl=o?[['all','Semua'],['wait','Belum dicek'],['part','Sebagian']]:[['all','Semua'],['short','Ada kekurangan']];
return `<div class=hero><small>PENERIMAAN PACKAGING</small><h2>Halo, ${esc(S.name||'Petugas Gudang')} 👋</h2><p>${op.length?op.length+' permintaan menunggu diterima':'Tidak ada permintaan menunggu'}</p><div class=sy>${!DB?'● Database belum diisi (config.js)':PERR?'● ⚠ '+esc(PERR):'● Tersambung • cek terakhir '+lt()}</div><div class=hr><div class=seg><button class="${o?'on':''}" data-a=tab data-v=open>Masuk</button><button class="${!o?'on':''}" data-a=tab data-v=done>Riwayat</button></div><button class=rf data-a=gpl>↻ Cek sekarang</button></div></div>`+
`<div class=g3><div class=card><b>${op.filter(r=>!cnt(r)).length}</b><small>Menunggu</small></div><div class=card><b>${op.filter(cnt).length}</b><small>Sebagian</small></div><div class=card><b>${dn.length}</b><small>Selesai</small></div></div>`+
`<div class=srch><input id=qs type=search placeholder="Cari no. permintaan, SPK, customer, item" value="${esc(V.q||'')}" autocomplete=off></div><div class=chips>${fl.map(x=>`<button class="chip ${V.f===x[0]?'on':''}" data-a=fl data-v=${x[0]}>${x[1]}</button>`).join('')}</div><div id=lst>${listHtml()}</div>`}
/* Rekap kekurangan penerimaan */
const inPer=r=>V.per==='all'||String(r.rdate||'').slice(0,7)===today().slice(0,7);
const rekRows=()=>S.reqs.filter(r=>r.status==='done'&&inPer(r));
function rekTx(){const R=rekRows(),K=R.filter(hasShort),ln=[];ln.push('*REKAP KEKURANGAN PENERIMAAN PACKAGING*','Periode: '+(V.per==='all'?'Semua':'Bulan ini'),'Penerimaan selesai: '+R.length+', dengan kekurangan: '+K.length,'');
if(!K.length)ln.push('Tidak ada kekurangan.');K.forEach((r,i)=>{ln.push((i+1)+'. '+r.no+' (terima '+fd(r.rdate)+')');shorts(r).forEach(l=>ln.push('   - '+l.nm+': kurang '+short(l)+' '+l.unit+' (diminta '+l.qty+', diterima '+(got(l)??0)+'). Alasan: '+(l.note||'-')))});return ln.join('\n')}
function vRek(){const R=rekRows(),K=R.filter(hasShort);
return `<div class=chips>${[['bln','Bulan ini'],['all','Semua']].map(x=>`<button class="chip ${V.per===x[0]?'on':''}" data-a=pr data-v=${x[0]}>${x[1]}</button>`).join('')}</div>`+
`<div class=g3><div class=card><b>${R.length}</b><small>Selesai</small></div><div class=card><b>${R.length-K.length}</b><small>Lengkap</small></div><div class=card><b style="color:var(--red)">${K.length}</b><small>Kurang</small></div></div>`+

async function pull(manual){if(!DB){if(manual)tst('Alamat database belum diisi (config.js)');return}
